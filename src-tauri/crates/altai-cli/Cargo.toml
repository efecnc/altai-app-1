[package]
name = "altai-cli"
version = "0.7.2"
description = "ALTAI terminal product and desktop launcher router"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/altaidevorg/altai-app"

[[bin]]
name = "altai-cli"
path = "src/main.rs"

[dependencies]
altai-core = { path = "../altai-core" }
altai-agent-service = { path = "../altai-agent-service" }
altai-control-plane = { path = "../altai-control-plane" }
altai-control-protocol = { path = "../altai-control-protocol" }
altai-protocol = { path = "../altai-protocol" }
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
# Real-plane spike mode (CP-08-85): loopback HTTP client riding the same
# hyper stack axum serves with — no new external crates beyond the tree.
hyper = "1"
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1", "tokio"] }
http-body-util = "0.1"
bytes = "1"
clap = { version = "4.6.1", features = ["derive"] }
clap_complete = "4.6.0"
isanagent = { git = "https://github.com/altaidevorg/isanagent.git", branch = "main" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
toml = "0.8"
tower = { version = "0.5", features = ["util"] }
log = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "signal", "sync", "time", "macros", "io-util", "io-std"] }
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
dirs = "5"

[dev-dependencies]
tempfile = "3"
rusqlite = { version = "0.38.0", features = ["bundled"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["windows-native"] }
