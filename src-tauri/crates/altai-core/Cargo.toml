[package]
name = "altai-core"
version = "0.7.2"
description = "Shared, Tauri-independent primitives for the ALTAI terminal product"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/altaidevorg/altai-app"

[dependencies]
rusqlite = { version = "0.38.0", features = ["bundled"] }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    # LockFileEx's OVERLAPPED parameter lives in the System::IO module.
    "Win32_System_IO",
] }

[dev-dependencies]
tempfile = "3"
