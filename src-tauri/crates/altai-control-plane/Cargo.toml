[package]
name = "altai-control-plane"
version = "0.1.0"
description = "Federated ALTAI control-plane service contracts and host registration"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/altaidevorg/altai-app"

[dependencies]
altai-control-protocol = { path = "../altai-control-protocol" }
altai-core = { path = "../altai-core" }
axum = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.6.1", features = ["derive", "env"] }
cron = "0.12"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.38", features = ["bundled"] }
sha2 = "0.10"
subtle = "2.6"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "time"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tempfile = "3"
